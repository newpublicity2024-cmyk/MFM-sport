name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Exposes whether a CI database secret is configured, so the build step
    # can be skipped when it isn't (Vercel builds every PR regardless).
    env:
      HAS_DB: ${{ secrets.CI_DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json, so the pnpm version has exactly one source of truth and
      # CI cannot drift from what developers run locally. Specifying both risks
      # a conflict between them.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:run
      # The Payload build connects to the DB, so it only runs when a CI database
      # secret is provided. Without it, Vercel's per-PR build is the build gate.
      - run: pnpm build
        if: env.HAS_DB == 'true'
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          PAYLOAD_SECRET: ci-only-secret-not-used-at-runtime-0000000000000000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
